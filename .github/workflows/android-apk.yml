name: NEXUS IA - Android APK direto
on:
  push:
    branches: [nexus-android-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar aplicativo
        run: gradle :app:assembleDebug --stacktrace
      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK instalável
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NEXUS_IA_Android.apk
          gh release delete nexus-mobile-0.4 --yes 2>/dev/null || true
          gh release create nexus-mobile-0.4 NEXUS_IA_Android.apk --title "NEXUS IA Android 0.4" --notes "APK de desenvolvimento para instalação direta no Android. Editor de código, projetos de jogos Godot, exportação ZIP offline. O NEXUS SWARM depende de integração com o PC e não está ativo neste APK." --target "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-IA-Android-APK
          path: NEXUS_IA_Android.apk
