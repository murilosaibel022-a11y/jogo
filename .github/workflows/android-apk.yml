name: NEXUS IA Offline Android APK
on:
  push:
    branches: [nexus-android-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar Android SDK e NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Obter motor llama.cpp verificado e fixado
        run: |
          mkdir -p app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp init -q
          git -C app/src/main/cpp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C app/src/main/cpp/llama.cpp fetch --depth 1 origin a68799c6094020a020cee72895b8df36b3b81098
          git -C app/src/main/cpp/llama.cpp checkout -q --detach FETCH_HEAD
          test -f app/src/main/cpp/llama.cpp/include/llama.h
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nexus-offline-dev-signature-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Integrar ícone fotorrealista ao aplicativo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d assets/nexus_blackhole_icon.webp.b64 > app/src/main/res/drawable-nodpi/nexus_icon.webp
          rm app/src/main/res/drawable/nexus_icon.xml
          file app/src/main/res/drawable-nodpi/nexus_icon.webp
      - name: Compilar aplicativo Android com inferência nativa
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Validar APK e biblioteca local
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libnexuslocal.so'
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK direto para instalar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NEXUS_IA_Android_0.7.apk
          gh release delete nexus-mobile-blackhole-0.7 --yes 2>/dev/null || true
          gh release create nexus-mobile-blackhole-0.7 NEXUS_IA_Android_0.7.apk --title "NEXUS IA 0.7 — Android" --notes "NEXUS IA com chat na abertura, ícone cinematográfico de buraco negro, interface minimalista escura com cores vibrantes, voz direta no aplicativo sem popup de busca, anexo e Studio consistente. Motor GGUF local ARM64 requer download inicial de 484 MB e espaço interno. APK de desenvolvimento, não validado fisicamente." --target "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-IA-Offline-Android-APK
          path: NEXUS_IA_Android_0.7.apk
